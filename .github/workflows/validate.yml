name: Validate repository

on:
  push:
    paths:
      - ".github/**"
      - "docs/**"
      - "immortalwrt/**"
      - "scripts/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/**"
      - "docs/**"
      - "immortalwrt/**"
      - "scripts/**"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install YAML parser
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Validate scripts, workflows, and device list
        shell: bash
        run: bash scripts/validate-repository.sh

  upstream-config:
    name: Resolve ImmortalWrt 25.12 config and preflight GN
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install configuration dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libelf-dev libncurses-dev libssl-dev ninja-build patch python3-pyelftools \
            python3-setuptools rsync swig \
            unzip zlib1g-dev zstd

      - name: Verify host compiler
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/check-host-compiler.sh"

      - name: Fetch ImmortalWrt and feeds
        shell: bash
        run: |
          set -euo pipefail
          git init -q openwrt
          git -C openwrt remote add origin https://github.com/immortalwrt/immortalwrt
          git -C openwrt fetch -q --depth=1 --no-tags origin openwrt-25.12
          git -C openwrt -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Resolve requested configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/immortalwrt/diy-part1.sh"
          install -m 0644 "$GITHUB_WORKSPACE/immortalwrt/rockchip/defconfig" .config
          "$GITHUB_WORKSPACE/immortalwrt/diy-part2.sh"
          make defconfig
          "$GITHUB_WORKSPACE/scripts/check-resolved-config.sh" .config
          "$GITHUB_WORKSPACE/scripts/write-source-manifest.sh" "$GITHUB_WORKSPACE/COMMUNITY_SOURCES.txt"

      - name: Preflight GN host tool
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          make package/feeds/packages/gn/host/compile -j1 V=s

