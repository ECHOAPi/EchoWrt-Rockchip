name: Validate repository

on:
  push:
    paths:
      - ".github/**"
      - "docs/**"
      - "immortalwrt/**"
      - "scripts/**"
      - "README.md"
  pull_request:
    paths:
      - ".github/**"
      - "docs/**"
      - "immortalwrt/**"
      - "scripts/**"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install YAML parser
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Validate scripts, workflows, and device list
        shell: bash
        run: bash scripts/validate-repository.sh
